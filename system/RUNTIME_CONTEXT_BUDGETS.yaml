  fetched_operation:
    # 12,000 governs a single fetched rules operation, which is what
    # Recommendation R1 sized this for. Three Gatefall surfaces are a different
    # thing and are governed by their own baseline and the ratchet rather than by
    # a ceiling they can never meet:
    #
    #   `/system`      the Console, which reads the whole Bearer to render a
    #                  screen of it (Profile Section 15.2);
    #   `/system gear` the worn loadout and the dimensional inventory, merged into
    #                  one panel at Profile 1.46 because Section 12.9 governs them
    #                  as one surface — it inherits the union of the two reads the
    #                  superseded `/system equipment` and `/system inventory`
    #                  baselines used to carry separately;
    #   `/system all`  every panel by definition, so the union of every read.
    #
    # Every other focused panel sits inside 12,000 with room. `/system skills`
    # grew at 1.46 because Section 15.3.1 authored a render template where 1.45
    # declared a focused view and authored none; the baseline is re-recorded
    # against the authored section, not against the absence of one.
    #
    # `/system titles` was baselined at 460 against a Bearer who held no titles
    # and could not hold any: Section 16 had no trigger before Profile 1.47, so
    # the panel read an empty field and a template with nothing in it. The 1.47
    # Title Assessment fills both sides at once — nine granted entries, each
    # carrying its criterion and the Event that proved it, against a catalog
    # section that grew from five rows to twenty-one across three grades, and
    # each granted entry carries its grade, its rung, and the Event that proved
    # it. The baseline is re-recorded against a panel that now has something to
    # render. It stays far inside the 12,000 ceiling and needs no exemption.
    #
    # Re-recorded 2026-08-03 across every Gatefall panel, for one reason with
    # two sizes. Section 15.1 is the render grammar — fixed width, the mandatory
    # blank interior rows, the gutter, bracketed Rank, `—` for a value canonical
    # state does not hold, an empty group still rendering `none`, and the
    # standing prohibition on truncating — and it declares itself normative for
    # every panel identically. No command dispatched it. Every panel therefore
    # loaded every value it renders and none of the layout it renders them into,
    # and a panel rendered from a remembered frame is exactly the narrowed,
    # spacing-dropped window the render policy exists to forbid. It costs 1,277
    # tokens on each panel and every panel now carries it.
    #
    # `/system all` is the larger correction: 19,443 -> 33,836. Its dispatch was
    # Section 15.4 alone, which is 116 tokens that name the panels it composes
    # and author no layout of their own — a plan holding the whole of the
    # Bearer's state and effectively no render procedure. It now dispatches the
    # eight sections it actually renders. That figure is not new cost; it is the
    # first honest measurement of what "every panel in one reply" was always
    # going to take, and it is the strongest argument for the ownership-ledger
    # trimming noted below.
    #
    # Two baselines also stop being placeholders. `/system gear` at a round
    # 25,000 and `/system shop` at a round 10,000 were hand-entered rather than
    # measured; both are recorded from the tool now. `/system log` falls 9,498 ->
    # 7,187 for a different reason: it declared the quest fields it renders while
    # the planner silently dropped them, because it applied `protagonist_fields`
    # only when the character sheet was also a live read. The panel now loads the
    # quest state it always claimed to, and still comes in below its stale
    # baseline.
    #
    # `/system` and `/system gear` remain roughly twice the 12,000 subdivision
    # threshold, and neither the grammar nor the templates are why: 13,223 tokens
    # of each is `120_INVENTORY_AND_OWNERSHIP.md` read whole, because the FUNDS
    # block needs current cash and that figure is derived across dated history
    # rather than held in one block. `required_live_reads` accepts a heading
    # selector now, but pointing it at `Generic Holdings` would render a stale
    # number with a plan that looks correct. Bringing these two inside the
    # ceiling is authoring — a current-holdings block in that ledger — and it
    # belongs to the owner, on the same reasoning the NPC-record note gives.
    # Ceiling raised 2026-08-04, 12,000 -> 16,000, on owner instruction, and the
    # warning band restored with it. Two things had gone wrong with the old
    # figure, and they compound.
    #
    # **The band was not a band.** `warning_tokens` and `failure_tokens` were
    # both 12,000, so this group had no warning state at all: every surface that
    # would have warned failed in the same measurement. The whole point of a
    # warning is to be seen while there is still room to act, and a group whose
    # warning fires simultaneously with its failure reports a problem only at
    # the moment it has become a blocker. The two focused panels that actually
    # approached the line — `/system shop` at 11,488 and `/system log` at 10,991
    # — spent their entire approach reading PASS, and would have gone straight
    # to FAILED on the next ordinary edit with no intermediate signal. Warning
    # now sits at 12,000, where it always meant to, and failure at 16,000.
    #
    # **And a ceiling is not re-recordable.** That is the property that made
    # this urgent rather than tidy. Every other pressure in this file is a
    # ratchet: it fires, a human reads what grew, and a deliberate re-record
    # clears it — the mechanism that caught `EVT-000407` working exactly as
    # designed. A ceiling has no such release. `/system shop` sat ~512 tokens
    # from a hard stop reached by twenty compliant skill entries, none of them
    # bloated, against a per-entry budget it measures well inside (880 against
    # 1,100). The next skill to gain a rung would have hit a wall with no
    # procedure behind it, and the only exits were an exemption — waiving the
    # check rather than answering it — or emergency trimming of canon under
    # deadline, which is the worst possible time to decide what a record may
    # lose.
    #
    # 16,000 is not a fresh number: it is the failure ceiling the `bootstrap`
    # group already carries against the same 12,000 warning, so the file gains
    # an internal consistency rather than another hand-picked constant. It
    # leaves ~4,500 tokens of headroom over the largest non-exempt panel, and
    # sits far under the readiness group's 35,000.
    #
    # What this deliberately does NOT do is relax the ratchet, which stays at
    # 15% and remains the real governor. Growth still has to be read and
    # re-recorded; this only stops a re-recordable surface from being killed by
    # a non-re-recordable one. Nor does it touch the three exempt Gatefall
    # panels below, which remain ratchet-governed for the reasons above — and
    # the ownership-ledger trimming that would bring `/system` and
    # `/system gear` back under any ceiling is still owner authoring work, still
    # unstarted, and is not paid for by this raise.
    warning_tokens: 12000
    failure_tokens: 16000
    growth_allowance_percent: 15
    exempt_from_failure_ceiling:
      - gatefall_pendragon_001:/system
      - gatefall_pendragon_001:/system gear
      - gatefall_pendragon_001:/system all
