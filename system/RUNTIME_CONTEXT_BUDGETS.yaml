# Per-entry budgets for collections that legitimately grow in length.
#
# A total cannot distinguish earned growth from bloat: seventeen skills should
# cost seventeen skills' worth of render data, and when `skills_known` also
# carried a per-use activation log it cost four times that at the same entry
# count. Dividing by the entry count separates the two — the figure is flat when
# the field holds only what it should, and climbs as soon as narrative starts
# accumulating inside it.
per_unit_budgets:
  - name: gatefall_skills_known
    file: campaigns/gatefall_pendragon_001/100_CHARACTER_SHEET.md
    field: canonical_state.system_state.skills_known
    max_bytes_per_entry: 1100
    reason: >-
      An entry holds the `/system` render line, its counters, a full statement
      of what the skill actually does at its current Rank and mastery — every
      authored category, with the effect spelled out rather than named — and the
      sentence naming the most recent mastery advance. Per-use logs and
      roll-by-roll narrative still belong in the chronicle, which already
      records them, and that is what this budget exists to keep out.

      Raised 700 -> 1100 on owner ruling, 2026-08-04. 700 was set when an entry
      was a render line plus counters, and it has been overtaken twice by
      legitimate growth rather than by bloat. Rank ascension appends a category
      clause per Rank — Keen Sense carries four, Exploit Pattern two — and
      Profile 1.52's magnitude-axis ladder (Decision 090) authors categories for
      five further skills that previously had none, so the field grows by design
      every time a skill ascends. The owner's requirement is that a skill entry
      explain its effect well enough to resolve an action from, without opening
      the profile: a player reading `/system skills` should not have to be told
      what "Thrown" or "Second target" means. Compressing that back into a name
      is exactly the failure mode Section 20.2 names — a stated value resting on
      an unstated rule.

      The ceiling still bites where it should. The historical bloat case, a
      per-use activation log inside the field, cost roughly four times the
      render figure at the same entry count — around 2,800 bytes per entry — and
      trips this at 1,100 as readily as at 700. What changed is the floor under
      legitimate effect prose, not the detector.

  - name: gatefall_relationship_state_updates
    file: campaigns/gatefall_pendragon_001/130_NPCS_AND_FACTIONS.md
    field: state_updates
    max_bytes_per_entry: 2400
    reason: >-
      A state update is what changed in the relationship and the Event that
      changed it. The narrative of the scene it came from belongs in the
      chronicle, which already holds it. Only `REL-000066` uses the field today,
      at three entries; the budget exists so the fourth is a sentence and not
      another essay.

  - name: gatefall_tracked_counters
    file: campaigns/gatefall_pendragon_001/100_CHARACTER_SHEET.md
    field: canonical_state.system_state.tracked_counters
    max_bytes_per_entry: 220
    reason: >-
      A counter is a path, a baseline, the Event that set it, and a current
      value. Prose explaining how it got there belongs in the chronicle.

# Per-object budgets for records that grow in prose rather than in entries.
#
# The resident core requires an NPC's record to be loaded before that NPC is
# played. That obligation is only keepable while a record is a record. A per-entry
# figure cannot see this failure: a Relationship holds one `texture` and one
# `state`, so no entry count rises while both fill with narrative.
#
# These are ratchets against the measured worst case, not targets. The numbers
# below record what the prototype campaign already carries; existing canon is not
# failed for being long. Trimming a record is authoring work and belongs to the
# owner, on the same reasoning Decision 076 gives for refusing to have a checker
# adjudicate prose.
per_object_budgets:
  - name: gatefall_npc_ledger_objects
    file: campaigns/gatefall_pendragon_001/130_NPCS_AND_FACTIONS.md
    object_prefixes: [ENT-, REL-]
    # Re-recorded 2026-08-05, 65,504 -> 77,150 (`EVT-000418`), and this one is
    # recorded with less comfort than the operation ratchets above.
    #
    # `ENT-000139` remains the pathological object this budget was written to
    # watch, and it grew again: the 2026-08-16 session gave Owen a weapon, had
    # him decline a real offer with his reasons, and had him clear an entire
    # D-Rank instance as the only combatant in it -- his largest single day in
    # the campaign, landing on the record that was already the largest.
    #
    # **The Runtime's own additions were trimmed twice before this was raised,
    # and that order matters.** The first draft of the session note ran ~5,700
    # bytes and was cut to ~1,900; a damage derivation duplicated between this
    # record and `120_INVENTORY_AND_OWNERSHIP.md` was removed from here and left
    # in the ledger that owns it. The object still measured 77,150 against a
    # 75,329 ratchet. What remained could only have come out of canon that
    # predates this session -- which is owner authoring work, not a Runtime
    # decision, on this file's own rule that existing canon is not failed for
    # being long.
    #
    # The distribution is the finding and it has got worse, not better: median
    # 2,549 bytes across 76 objects against a largest of 77,150. One record is
    # thirty times the median. `canonical_state.situation` and
    # `relationship_to_alexander` are where it lives, and both are genuinely
    # load-bearing for narration -- which is precisely why splitting Owen's
    # history out of his live record is authoring work rather than deletion.
    #
    # ---
    #
    # **Re-recorded 2026-08-09 by owner ruling, 77,150 -> 80,000.** Decision 091
    # gave Characters a disposition (Data Model 7.7-7.9), and backfilling it onto
    # `ENT-000139` took the object to 90,013 -- over the 88,722 ratchet. The
    # Runtime's own additions were trimmed first, as the note above requires and
    # for the third time: the disposition draft was halved, landing at **88,557**.
    # That left 165 bytes of headroom, which is not a place to leave a record that
    # grows every session. The owner re-recorded rather than trim canon.
    #
    # **This baseline is a chosen ceiling, not the measured worst, and the field
    # name overstates it.** The true worst is 88,557; 80,000 is recorded instead
    # because it is deliberately tighter than the actual, giving a 92,000 ratchet
    # and roughly 3.4 KB of headroom rather than the 101,840 that recording the
    # real figure would have produced. Read `baseline_worst_bytes` here as the
    # size this record is *permitted* to sit at, not the size it does.
    #
    # **A correction here was itself wrong, and is withdrawn (2026-08-09).** This
    # comment briefly claimed `canonical_state.situation` was 2,457 bytes rather
    # than the 36,624 the `reason` states. That measurement read only the field's
    # **first line** and missed 52 continuation lines: `situation` is a multi-line
    # YAML scalar, and it is **46,968 bytes** -- larger than the original note,
    # not smaller. The `reason` below was correct in kind and merely out of date.
    #
    # **The distribution inside the object is the actionable finding.** Of the
    # 100,177 bytes in `ENT-000139`, the entity dispatch fetches **57,941** before
    # he speaks -- and **`situation` alone is 46,968 of that, roughly 81% of his
    # scene cost**. Everything else the record holds (capabilities, knowledge,
    # standing_terms, learned_techniques, life_outside_gates, equipment,
    # relationship_to_alexander) totals 33,223 bytes and is **never fetched**: it
    # costs block size, not load.
    #
    # `situation` is one field doing two jobs -- where he is *now*, which the
    # Runtime needs, and a stack of dated spans going back weeks, which
    # `011_ENGINE_DATA_MODEL.md` Section 7.1 says is not what canonical state is
    # ("what is true now") and Section 7.2 says becomes historical evidence.
    # Retiring the superseded spans and keeping the current one is the single
    # change that would cut this object's load by roughly three quarters without
    # deleting anything. It remains owner authoring work under the rule above.
    baseline_worst_bytes: 63743
    growth_allowance_percent: 15
    reason: >-
      The distribution is the point: the median block is about 2.7 KB across 79
      objects and the largest is many times that, so an average describes
      nothing and the worst case is the only figure that measures the cost of
      the resident rule requiring an NPC's record to be loaded before it speaks.

      Re-recorded DOWNWARD 2026-08-10, 80,000 -> 63,743, and the largest object
      changed identity: `ENT-000139` fell from 91,979 bytes to 42,522 and
      `REL-000066` is now the worst case at 63,743. Owen's record was audited
      field by field and **51.6% of it was `situation`: 40 dated blocks
      narrating spans `160_CAMPAIGN_CHRONICLE.md` already narrates in full.**
      That field now holds the current span alone. Nothing that governs how he
      is played was touched -- the six disposition fields cost 7% of the record
      between them and were never the problem.

      Two things had to ship with that cut, and both are the interesting part.
      Decision 085 requires a record to REFERENCE every Event claiming to have
      moved it, which reducing the narrative would have broken; a
      `moved_by_events` citation index satisfies it at about 14 bytes per Event,
      because citing and narrating are different obligations and only the first
      is cheap. It also surfaced 13 Events that claimed `record-updated` and
      were referenced nowhere in the record at all. And `situation` held one
      live channel constraint -- what Owen has not been told about Walt's
      operation -- which moved to `knowledge`, where something actually reads
      it; a constraint that lives only in narrative history is one nothing will
      ever check (`F-029`).

      The prior reason text claimed the bulk was "five markdown prose paragraphs
      in that entity's section, together about 32 KB". That was wrong about the
      mechanism: `measure_runtime_context.py` iterates `OBJECT_FENCE`, so this
      budget has only ever measured the fenced YAML blocks. The figure it
      reports is the record, not the surrounding prose.

