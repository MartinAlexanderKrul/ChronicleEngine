      gatefall_pendragon_001:/system gear: 30649
      gatefall_pendragon_001:/system titles: 4513
      # Re-recorded 2026-08-04, 33,836 -> 62,654 (+28,818). **Almost none of
      # this is growth. It is the removal of a measurement artifact, and the
      # old figure was never a measurement of this surface at all.**
      #
      # `/system all` is the only operation whose protagonist selector is
      # `canonical_state.system_state` **whole** (`fields:1`); every other panel
      # enumerates named fields. The whole-block extractor ends the block at the
      # first line indented at or below the parent's level — and
      # `temporal_state.settlement_note`, a double-quoted scalar, contained
      # **continuation lines starting at column 0** ("Both pools reach and hold
      # their caps...", "Prior anchor state, superseded..."). Legal YAML, which
      # is why both blocks parse clean and why no gate ever complained. But the
      # extractor stopped at the first of them, so `system_state` measured
      # **3,432 tokens for a block that is actually ~26,223** — it was reading
      # roughly an eighth of the Bearer and reporting a total.
      #
      # `EVT-000411`'s session retired that superseded anchor chain to the
      # chronicle, which removed the column-0 lines, which removed the early
      # terminator. The surface did not grow by 28,818 tokens; it started being
      # measured. The honest figure is recorded here and the baseline is
      # rebuilt on it rather than on the accident.
      #
      # **This is `F-013`/`F-015`'s class exactly, a third time: a stated number
      # resting on an unstated assumption about the substrate.** There the
      # assumption was a hand-maintained constant and a rendered surface never
      # compared to its record; here it is that a YAML scalar's continuation
      # lines will be indented. Nothing checks that, and the failure is silent
      # and *downward* — it under-reports, so it can never trip a ratchet. The
      # three other `fields:N` surfaces are unaffected because enumerating named
      # fields does not use the block scan.
      #
      # The number itself is not a surprise once measured: `/system all` renders
      # every panel, so it reads the whole Bearer plus the whole ownership
      # ledger plus eight render sections. It is exempt from the 16,000 ceiling
      # by design and governed by the ratchet alone, which is what just fired.
      gatefall_pendragon_001:/system all: 62654
      # Re-recorded 2026-08-03, 7,187 -> 8,342. `/system log` reads Current
      # State, which gained the Profile 1.48 Stat Passive settlement: four
      # skills rising C -> B in one Event, and the reason each one did. That is
      # live readiness a Runtime has to carry, and it is one-time — the next
      # rung movement edits these lines rather than adding a block.
      # Re-recorded 2026-08-04, 8,342 -> 9,653. Current State had already grown
      # to 9,531 by `EVT-000390` — 62 tokens under the ratchet — so the next
      # real change to it was always going to trip, and this one is a standing
      # open ascension offer (`EVT-000391`, Twin Fang) that Section 7.5 requires
      # to re-surface at every barrier: readiness a Runtime cannot carry
      # implicitly. Two stale lines were retired in the same pass rather than
      # re-baselining over them — a duplicated damage-preview pair that
      # contradicted the line below it, and the `F-012` manual-check workaround
      # that Decision 090 replaced. The 12,000 ceiling is untouched.
      # Re-recorded 2026-08-04, 9,653 -> 10,991 (+1,338), from `EVT-000407`'s
      # Current State edits: the three settled mastery advances, the corrected
      # weapon and Mana Bolt previews, and the restored-holdings accounting.
      # This one was *inside* the 15% allowance (11,101) and would have stayed
      # silent — recorded anyway, because this file's own repeated warning is
      # that a stale baseline breaks the ratchet in both directions, and this
      # surface has now been the subject of that warning three re-records
      # running. It is also the clearest illustration of why the ceiling moved
      # in the same pass: at the old 12,000, a panel that had just passed would
      # have had ~1,000 tokens left before a hard stop with no release.
      gatefall_pendragon_001:/system log: 10991
      reikon_awakening_001:/system: 8985
    subdivision_message: fetched operation requires a narrower selector

# Per-entry budgets for collections that legitimately grow in length.
#
# A total cannot distinguish earned growth from bloat: seventeen skills should
# cost seventeen skills' worth of render data, and when `skills_known` also
# carried a per-use activation log it cost four times that at the same entry
# count. Dividing by the entry count separates the two — the figure is flat when
# the field holds only what it should, and climbs as soon as narrative starts
# accumulating inside it.
per_unit_budgets:
  - name: gatefall_skills_known
    file: campaigns/gatefall_pendragon_001/100_CHARACTER_SHEET.md
    field: canonical_state.system_state.skills_known
    max_bytes_per_entry: 1100
    reason: >-
      An entry holds the `/system` render line, its counters, a full statement
      of what the skill actually does at its current Rank and mastery — every
      authored category, with the effect spelled out rather than named — and the
      sentence naming the most recent mastery advance. Per-use logs and
      roll-by-roll narrative still belong in the chronicle, which already
      records them, and that is what this budget exists to keep out.

      Raised 700 -> 1100 on owner ruling, 2026-08-04. 700 was set when an entry
      was a render line plus counters, and it has been overtaken twice by
      legitimate growth rather than by bloat. Rank ascension appends a category
      clause per Rank — Keen Sense carries four, Exploit Pattern two — and
      Profile 1.52's magnitude-axis ladder (Decision 090) authors categories for
      five further skills that previously had none, so the field grows by design
      every time a skill ascends. The owner's requirement is that a skill entry
      explain its effect well enough to resolve an action from, without opening
      the profile: a player reading `/system skills` should not have to be told
      what "Thrown" or "Second target" means. Compressing that back into a name
      is exactly the failure mode Section 20.2 names — a stated value resting on
      an unstated rule.

      The ceiling still bites where it should. The historical bloat case, a
      per-use activation log inside the field, cost roughly four times the
      render figure at the same entry count — around 2,800 bytes per entry — and
      trips this at 1,100 as readily as at 700. What changed is the floor under
      legitimate effect prose, not the detector.

  - name: gatefall_relationship_state_updates
    file: campaigns/gatefall_pendragon_001/130_NPCS_AND_FACTIONS.md
    field: state_updates
    max_bytes_per_entry: 2400
    reason: >-
      A state update is what changed in the relationship and the Event that
      changed it. The narrative of the scene it came from belongs in the
      chronicle, which already holds it. Only `REL-000066` uses the field today,
      at three entries; the budget exists so the fourth is a sentence and not
      another essay.

  - name: gatefall_tracked_counters
    file: campaigns/gatefall_pendragon_001/100_CHARACTER_SHEET.md
    field: canonical_state.system_state.tracked_counters
    max_bytes_per_entry: 220
    reason: >-
      A counter is a path, a baseline, the Event that set it, and a current
      value. Prose explaining how it got there belongs in the chronicle.

# Per-object budgets for records that grow in prose rather than in entries.
#
# The resident core requires an NPC's record to be loaded before that NPC is
# played. That obligation is only keepable while a record is a record. A per-entry
# figure cannot see this failure: a Relationship holds one `texture` and one
# `state`, so no entry count rises while both fill with narrative.
#
# These are ratchets against the measured worst case, not targets. The numbers
# below record what the prototype campaign already carries; existing canon is not
# failed for being long. Trimming a record is authoring work and belongs to the
# owner, on the same reasoning Decision 076 gives for refusing to have a checker
# adjudicate prose.
per_object_budgets:
  - name: gatefall_npc_ledger_objects
    file: campaigns/gatefall_pendragon_001/130_NPCS_AND_FACTIONS.md
    object_prefixes: [ENT-, REL-]
    baseline_worst_bytes: 65504
    growth_allowance_percent: 15
    reason: >-
      The distribution is the point: the median block is around 2 KB and the
      largest is over sixty. `ENT-000139` is 65,504 bytes, of which
      `canonical_state.situation` alone is 36,624 — a state field holding an
      accumulated history the campaign chronicle already records. `REL-000066` is
      51,904, of which `texture` is 26,723 and `state` is 17,008. Loading that one
      NPC and its relationship costs roughly 29,000 tokens, against a readiness
      ceiling of 30,000 and a fetched-operation ceiling of 12,000. Every other
      entity in the ledger is affordable.
