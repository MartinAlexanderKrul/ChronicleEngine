  readiness:
    warning_tokens: 20000
    # Raised 2026-08-03, 30,000 -> 35,000, by owner ruling, with the trimming
    # deferred rather than cancelled.
    #
    # The ceiling had become the binding constraint on recording true things.
    # Gatefall readiness stood at 29,971 -- 29 tokens of room -- and the work
    # that hit it was not bloat: an unresolved B-Rank Gate's owed loot needs to
    # live in a readiness surface or no session will ever raise it, because the
    # chronicle is written to and never scanned back. A ceiling that makes the
    # correct record unaffordable stops measuring cost and starts suppressing
    # facts, which is the opposite of what this file is for.
    #
    # 35,000 is a deliberate figure, not a doubling: it restores roughly the
    # 5,000-token working margin this surface had before the Profile 1.47-1.50
    # run, and leaves the warning at 20,000 so every campaign above it still
    # reports as needing attention on every measurement. Gatefall has been over
    # that warning for weeks and this does not change that verdict.
    #
    # WHAT THIS DOES NOT DO: it does not retire Recommendation R14. Current
    # State (~4,900) and the startup file (~4,336) are still the levers, and
    # moving `titles` into a deferred group is still the obvious structural win
    # -- the Console needs only its count. The owner has taken the trimming as
    # their own later work; this raise buys the room to keep recording
    # correctly in the meantime, and the growth ratchet below is what keeps the
    # meantime honest, since a re-record is still a deliberate act.
    #
    # Raised 2026-08-04, 35,000 -> 40,000, on owner instruction, for the reason
    # the block above already anticipated: **the ceiling came due, and it came
    # due against a correct record rather than a bloated one.** Gatefall's
    # readiness surface reached 35,541 at `EVT-000411` — an ordinary played
    # evening of two meetings, no combat, one identified object and two new
    # relationships. Roughly 1,000 tokens of Runtime verbosity were trimmed out
    # of `180_CURRENT_STATE.md` first and the surface still did not fit, which
    # is the distinction that decided this: the remaining 541 could only have
    # come out of live canon.
    #
    # **A ceiling that makes the correct record unaffordable stops measuring
    # cost and starts suppressing facts** — this block's own words, five
    # paragraphs up, now describing an actual event rather than a hypothetical.
    # The alternative on the table was deleting real campaign record to fit a
    # number, and this file already rules on that: existing canon is not failed
    # for being long, and trimming a record is authoring work that belongs to
    # the owner.
    #
    # Same shape as the `fetched_operation` raise in the same pass: **only the
    # failure ceiling moves.** The warning stays at 20,000, so every campaign
    # above it still reports as needing attention on every measurement, and
    # Gatefall has been over that warning for weeks — unchanged verdict. The
    # 15% ratchet below is untouched and remains the real governor; growth still
    # has to be read and deliberately re-recorded. What this buys is ~4,450
    # tokens of working margin, not permission to stop looking.
    #
    # R14 is still not retired and is now overdue rather than pending. Current
    # State and the startup file are still the levers; `titles` into a deferred
    # group is still the obvious structural win. This is the second time that
    # work has been deferred by raising a number instead.
    failure_tokens: 40000
    # Growth beyond the allowance fails until the baseline is re-recorded. See
    # the note at the foot of this file for why a rate governs these surfaces
    # rather than a fixed ceiling alone.
    growth_allowance_percent: 15
