context_budget_version: "1.0"
estimator:
  method: utf8_bytes_divided_by
  divisor: 4
  rounding: ceiling

surfaces:
  resident:
    warning_tokens: 6000
    failure_tokens: 8000
    # Re-recorded 2026-08-01, twice in one session. First +318 for the F-008
    # authoring default (Resident Core 1.16, "Unnamed Is Not Absent"), then +248
    # for the commitment creation rule (1.17, "A Promise Is Recorded In The Turn
    # It Is Made"). Both figures are attributable in full; nothing else moved the
    # card. It now stands at 5,806 against a 6,000 warning -- 194 tokens of
    # headroom, the tightest it has been. The next resident addition should
    # displace text rather than append to it, or move the warning deliberately.
    #
    # Re-recorded 2026-07-31 after two independent lines of work landed in the
    # same card: the F-001 canvass and standing-grounding rule plus commitment
    # and supply settlement (Resident Core 1.13), and the NPC load obligation
    # and its bounded dispatch (1.14, 1.15). Neither side's figure survives the
    # merge, so this is measured against the combined card rather than added up.
    # The prior 3,453 had also drifted +813 before any of it, which is the
    # argument for re-recording on every deliberate change rather than only when
    # a ceiling is hit.
    # Re-recorded again 2026-08-01 for "The World's Answer Is Due In The Scene
    # That Asks" (1.18), which replaced the promise section rather than joining
    # it: a whole new governing rule for +92 net, because the F-008 tail that
    # duplicated it was cut to a handoff. At 5,911 the card has 89 tokens of
    # headroom and is effectively full. The next rule cannot be appended at all
    # -- it displaces something, or the 6,000 warning moves on a deliberate
    # ruling with the readiness surfaces re-measured behind it.
    # Re-recorded 2026-08-01 for the F-009 name-collision clause (1.19): +67,
    # and that is the last append this card can absorb. At 5,978 it stands
    # 22 tokens under the 6,000 warning. Treat the surface as closed: the next
    # resident rule displaces text, or the warning moves as a deliberate owner
    # ruling with all four readiness baselines re-measured behind it. The
    # Version 0.3 postmortem records this as an architectural constraint on the
    # per-turn enforcement layer rather than as a budget note, because it is the
    # binding limit on the one obligation class that has no mechanical proxy.
    # Re-recorded 2026-08-02 for the naming-time collision gate: 5,978 -> 5,976,
    # a net -2. This is the first resident change made under the closed-surface
    # rule above, and it is what that rule asks for -- the F-009 clause was
    # replaced in place rather than joined, so naming the instrument and both its
    # verdicts costs less than the sentence it displaced. Headroom is 24 tokens
    # and the surface stays closed; the constraint is unchanged, not relaxed by
    # having been met once.
    baseline_tokens: 5976
    contributors:
      - file: docs/AI_GAMEPLAY_RESIDENT_CORE.md
        whole_file: true
        reason: per-turn invariant card

  bootstrap:
    warning_tokens: 12000
    failure_tokens: 16000
    baseline_tokens: 2499
    contributors:
      - file: README.md
        heading: Play Chronicle Engine — the `/ChronicleEngine` command
        reason: bootstrap procedure and complete command catalog
      - file: system/WORLDS_AND_CAMPAIGNS.md
        markdown_table_under: Worlds
        reason: rendered world inventory
      - file: system/WORLDS_AND_CAMPAIGNS.md
        markdown_table_under: Campaigns
        reason: rendered campaign inventory

  readiness:
    warning_tokens: 20000
    failure_tokens: 30000
    # Growth beyond the allowance fails until the baseline is re-recorded. See
    # the note at the foot of this file for why a rate governs these surfaces
    # rather than a fixed ceiling alone.
    growth_allowance_percent: 15
    # Every readiness surface includes the resident card, so a resident change
    # moves all four. Gatefall's figure now covers the Closed Channels table (561)
    # and the cast roster (894), which is what buys the NPC records their place
    # off this surface: readiness carries who exists and what a player has ruled
    # unknowable, and the records themselves are fetched at the encounter. It sits
    # above the 20,000 warning, as it did before this work.
    #
    # Re-recorded 2026-08-01 with the resident figure above. Three of the four
    # moved by exactly the card's combined +566, which is the whole of this
    # session's engine work. Gatefall moved +2,184, so +1,618 of it is campaign
    # drift that had already accumulated and is recorded here rather than
    # absorbed silently: Current State has grown to 8,877 tokens and the manifest
    # is now Checkpoint 0052. That surface is at 28,343 against a 30,000 hard
    # failure and will breach it on ordinary play, not on engine work. Trimming
    # it is authoring and belongs to the owner (Recommendation R14).
    baseline_tokens_by_campaign:
      gatefall_pendragon_001: 28722
      prototype_alpha: 9142
      prototype_beta: 9655
      reikon_awakening_001: 13466
    include_resident: true
    derive_operation: continue

  fetched_operation:
    # 12,000 governs a single fetched rules operation, which is what
    # Recommendation R1 sized this for. Three Gatefall surfaces are a different
    # thing and are governed by their own baseline and the ratchet rather than by
    # a ceiling they can never meet:
    #
    #   `/system`      the Console, which reads the whole Bearer to render a
    #                  screen of it (Profile Section 15.2);
    #   `/system gear` the worn loadout and the dimensional inventory, merged into
    #                  one panel at Profile 1.46 because Section 12.9 governs them
    #                  as one surface — it inherits the union of the two reads the
    #                  superseded `/system equipment` and `/system inventory`
    #                  baselines used to carry separately;
    #   `/system all`  every panel by definition, so the union of every read.
    #
    # Every other focused panel sits inside 12,000 with room. `/system skills`
    # grew at 1.46 because Section 15.3.1 authored a render template where 1.45
    # declared a focused view and authored none; the baseline is re-recorded
    # against the authored section, not against the absence of one.
    warning_tokens: 12000
    failure_tokens: 12000
    growth_allowance_percent: 15
    exempt_from_failure_ceiling:
      - gatefall_pendragon_001:/system
      - gatefall_pendragon_001:/system gear
      - gatefall_pendragon_001:/system all
    baseline_tokens_by_operation:
      gatefall_pendragon_001:save: 2486
      gatefall_pendragon_001:/system: 22904
      gatefall_pendragon_001:/system skills: 5233
      gatefall_pendragon_001:/system shop: 6421
      gatefall_pendragon_001:/system quests: 2315
      gatefall_pendragon_001:/system gear: 18851
      gatefall_pendragon_001:/system titles: 460
      gatefall_pendragon_001:/system log: 9498
      gatefall_pendragon_001:/system all: 19443
      reikon_awakening_001:/system: 8985
    subdivision_message: fetched operation requires a narrower selector

# Per-entry budgets for collections that legitimately grow in length.
#
# A total cannot distinguish earned growth from bloat: seventeen skills should
# cost seventeen skills' worth of render data, and when `skills_known` also
# carried a per-use activation log it cost four times that at the same entry
# count. Dividing by the entry count separates the two — the figure is flat when
# the field holds only what it should, and climbs as soon as narrative starts
# accumulating inside it.
per_unit_budgets:
  - name: gatefall_skills_known
    file: campaigns/gatefall_pendragon_001/100_CHARACTER_SHEET.md
    field: canonical_state.system_state.skills_known
    max_bytes_per_entry: 700
    reason: >-
      An entry holds the `/system` render line, its counters, and the sentence
      naming the most recent mastery advance. Per-use logs and roll-by-roll
      narrative belong in the chronicle, which already records them.

  - name: gatefall_relationship_state_updates
    file: campaigns/gatefall_pendragon_001/130_NPCS_AND_FACTIONS.md
    field: state_updates
    max_bytes_per_entry: 2400
    reason: >-
      A state update is what changed in the relationship and the Event that
      changed it. The narrative of the scene it came from belongs in the
      chronicle, which already holds it. Only `REL-000066` uses the field today,
      at three entries; the budget exists so the fourth is a sentence and not
      another essay.

  - name: gatefall_tracked_counters
    file: campaigns/gatefall_pendragon_001/100_CHARACTER_SHEET.md
    field: canonical_state.system_state.tracked_counters
    max_bytes_per_entry: 220
    reason: >-
      A counter is a path, a baseline, the Event that set it, and a current
      value. Prose explaining how it got there belongs in the chronicle.

# Per-object budgets for records that grow in prose rather than in entries.
#
# The resident core requires an NPC's record to be loaded before that NPC is
# played. That obligation is only keepable while a record is a record. A per-entry
# figure cannot see this failure: a Relationship holds one `texture` and one
# `state`, so no entry count rises while both fill with narrative.
#
# These are ratchets against the measured worst case, not targets. The numbers
# below record what the prototype campaign already carries; existing canon is not
# failed for being long. Trimming a record is authoring work and belongs to the
# owner, on the same reasoning Decision 076 gives for refusing to have a checker
# adjudicate prose.
per_object_budgets:
  - name: gatefall_npc_ledger_objects
    file: campaigns/gatefall_pendragon_001/130_NPCS_AND_FACTIONS.md
    object_prefixes: [ENT-, REL-]
    baseline_worst_bytes: 65504
    growth_allowance_percent: 15
    reason: >-
      The distribution is the point: the median block is around 2 KB and the
      largest is over sixty. `ENT-000139` is 65,504 bytes, of which
      `canonical_state.situation` alone is 36,624 — a state field holding an
      accumulated history the campaign chronicle already records. `REL-000066` is
      51,904, of which `texture` is 26,723 and `state` is 17,008. Loading that one
      NPC and its relationship costs roughly 29,000 tokens, against a readiness
      ceiling of 30,000 and a fetched-operation ceiling of 12,000. Every other
      entity in the ledger is affordable.
