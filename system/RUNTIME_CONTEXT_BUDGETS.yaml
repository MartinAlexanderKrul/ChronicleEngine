      and is why the file grew unnoticed -- no declared operation loads the
      fields that were doing the growing, so no budget reported them and
      readiness stayed flat at +0 through a 94,690-byte reduction.

      The failure mode it leaves is a read, not a load. At 247,496 bytes the
      file could no longer be opened in one pass by a reader with a token cap,
      which is how this surfaced: not from a gate, but from a person trying to
      read the sheet and being unable to. A worst-case object ratchet is the
      cheapest thing that would have said so first.

      **That failure mode is reduced and not closed, stated rather than
      implied.** At roughly 0.197 tokens per byte -- the ratio the reading tool
      itself reported on a comparable markdown file in this repository -- the
      sheet went from about 48,800 tokens to about 27,100 against a 25,000 cap.
      Still over, by around 2,000. Closing the rest would mean deleting typed
      state that readiness reads, which is the wrong trade, so it is not done
      here. The two honest options are to accept that this record is
      selector-read and never whole-file -- which is the existing contract and
      what readiness already does at about 10,000 tokens -- or to split the
      object, which changes the Data Model and needs an owner ruling rather
      than a budget note.
