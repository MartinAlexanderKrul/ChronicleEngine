# Function grouping for the derived skill ledger. This is a VIEW concern, not canon:
# 100_CHARACTER_SHEET.md is the source of every fact below except the grouping itself,
# which the sheet does not carry and should not. The generator joins the two.
#
# A skill in the sheet with no row here is a generator ERROR, not a silent omission --
# that is what keeps a new skill from falling out of the view unnoticed.

