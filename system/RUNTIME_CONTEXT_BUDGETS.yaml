context_budget_version: "1.0"
estimator:
  method: utf8_bytes_divided_by
  divisor: 4
  rounding: ceiling

# THE READ CAP. Owner ruling, 2026-08-12: the cap applies to every file, because
# the limit is the reader's and not the file's.
#
# Every budget below this block measures a LOAD -- what a declared operation
# pulls into context on purpose. None of them measured a READ: one agent opening
# one file to find something out. That is a different limit with a different
# failure mode, and it fails silently. A reader over the cap gets a truncated
# view and no error, so it does not know what it did not see.
#
# How this surfaced, which is the argument for gating it. `100_CHARACTER_SHEET.md`
# reached 247,496 bytes -- about 48,800 tokens against a 25,000 cap -- and no
# budget reported it, because readiness reads that file by field selector and
# measured a flat ~10,000 tokens the whole time. It was found by a person trying
# to open the sheet and being unable to.
#
# **The rule is not "every file stays small". It is "no file requires a read it
# cannot survive".** A chronicle is append-only by design and will pass a million
# bytes; that is correct. What is not correct is a chronicle nobody has declared
# a bounded way to read. So an over-cap file is conforming only if something
# declares how to read it in pieces -- a heading selector, an object fence, an id
# lookup -- and that declaration is what `tools/test_read_cap.ps1` checks.
read_cap:
  tokens: 25000
  # Measured against the reading tool's own reported figure rather than the
  # divisor-4 estimator above: it reported 43,471 tokens for
  # `engine/004_DESIGN_FLAGS.md` at 220,672 bytes, which is 0.197 tokens/byte.
  # The estimator above over-reports by about 27% on this corpus, and using it
  # here would fail files that read fine.
  tokens_per_byte: 0.197
  excluded_paths:
    # Immutable by policy (Rules Section 13.3): a checkpoint's bytes may not be
    # edited, so an over-cap snapshot is not a defect and cannot be one.
    - "**/saves/**"
    # Non-canonical derived artifacts; regenerated, never read for canon.
    - "**/exports/**"
    - "**/tmp/**"
    # Any dot-prefixed segment is scratch: `.tmp/`, `.tmp/checkpoint-recovery/`,
    # and the `.900_CHECKPOINT_*.staging-*` / `_RELAY` directories the rollback
    # path leaves behind. Same convention `generate_validation_evidence.py`
    # adopted after those directories broke a run (F-010).
    - "**/.*/**"
  bounded_read_required:
    # Over cap and conforming: each declares a bounded read path, so no reader
    # ever needs the whole file. `how` names the mechanism a reader must use.
    - file: campaigns/gatefall_pendragon_001/160_CAMPAIGN_CHRONICLE.md
      how: "Event id (`EVT-`) via the object fence; declared in 090_CAMPAIGN_STARTUP.md"
    - file: campaigns/gatefall_pendragon_001/130_NPCS_AND_FACTIONS.md
      how: "entity id via the `npc_present` dispatch and the Closed Channels heading selector"
    - file: campaigns/gatefall_pendragon_001/100_CHARACTER_SHEET.md
      how: "`canonical_state.system_state.*` field selectors; per-object ratchet below"
    - file: worlds/gatefall/206_WORLD_RULE_PROFILE.md
      how: "numbered section heading selectors declared in 090_CAMPAIGN_STARTUP.md"
    - file: campaigns/gatefall_pendragon_001/140_OBJECTIVES.md
      how: "objective id (`OBJ-`) via the object fence"
    - file: campaigns/gatefall_pendragon_001/170_CHANGELOG.md
      how: "dated entry, newest first; a reader wants the head, never the tail"
    - file: engine/001_ENGINE_DECISIONS.md
      how: "`## Decision NNN` heading; never read whole"
    - file: engine/030_ENGINE_CHANGELOG.md
      how: "dated entry under a version heading, newest first"
    - file: engine/004_DESIGN_FLAGS.md
      how: "`## F-NNN` heading"
    - file: system/ID_REGISTRY.md
      how: "identifier lookup by prefix; the high-water marks are in the footer"
    - file: tools/validate_repository.ps1
      how: "source; read by the check being changed, not end to end"

# What a tripped budget is allowed to cost. Owner ruling, 2026-08-10.
#
# A byte budget measures a LOADING cost, so a byte-driven remedy optimises
# loading -- and the largest thing in an NPC record is its character prose,
# which is precisely what the Resident Core's loading rule exists to protect
# ("canon that was never loaded cannot govern narration"; "manner is what
# compression removes"). Left unstated, the rule a Runtime infers under save
# pressure is "cut whatever is biggest", which points it straight at the
# campaign's memory. At Checkpoint 0084 that cost `ENT-000139` about 2,600
# bytes of authored record to buy seven bytes of headroom.
#
# So the order is fixed, and the last line is the point of the whole block: a
# surface that cannot be met without cutting character does not get cut. It
# reports the budget as the blocker and the owner decides. A budget is a
# statement about what the engine can afford to load, not a licence to forget.
trim_policy:
  version: "1.0"
  # Cut in this order, and stop as soon as the surface is inside its budget.
  order:
    - duplicated-event-history   # the chronicle already holds it in full
    - superseded-state           # explicitly replaced by a later value
    - runtime-authored-verbosity # the Runtime's own additions, this span first
  # Never cut to meet a budget, at any severity, without an owner ruling.
  never_trim:
    - disposition            # want, fear, secret, voice, beliefs, agenda
    - relationship_texture   # the register two characters are played in
    - standing_terms         # terms a character set and another accepted
    - knowledge              # what a character may and may not know
    - channel_constraints    # anything a channel check reads
  on_exhaustion: report-budget-as-blocker

# What a resident surface is FOR. Owner ruling, 2026-08-10.
#
# Readiness carries what a resolution reads and what a scene opens on. Reasoning,
# provenance and settled history are fetched when something actually asks for
# them. Stated as a rule because the drift is always the same shape and always
# invisible: a field holds a value, someone explains the value beside it, the
# explanation outlives the value, and the surface pays for it every session
# thereafter. `ENT-000125.temporal_state` reached 12,565 bytes around 213 bytes
# of clock -- 98.2% prose -- and its `settlement_note` described the `EVT-000492`
# anchor while `campaign_time` beside it already read `EVT-000497`. It had been
# stale in place and passed every gate.
#
# The carve-out is the part that matters, and it is not a compromise. Narration
# needs an NPC's manner BEFORE its first line, so a fetch is already too late;
# disposition and relationship texture are prose and stay resident. The rule
# governs explanations of state, not the material a character is played from.
resident_surface_policy:
  version: "1.0"
  resident:
    - values-a-resolution-reads
    - what-a-scene-opens-on
    - character-needed-before-a-first-line   # disposition, relationship texture
  fetched_on_demand:
    - reasoning-and-provenance
    - settled-history
    - catalogues-a-panel-renders-on-request
  # Citing an Event and narrating it are different obligations (Decision 085).
  # A record satisfies the first with a `moved_by_events` index at ~14 bytes per
  # Event; the chronicle satisfies the second, in full, where it is authoritative.
  citation_not_narration: moved_by_events

